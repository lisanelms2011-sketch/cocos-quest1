<style>
:root{
  --bg:#10180f;
  --panel:#fff8e8;
  --text:#2b2417;
  --muted:#6b5d43;
  --accent:#e8541e;
  --accent-text:#ffffff;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f0a; --panel:#2a2418; --text:#fbf1d8; --muted:#c5b58f; --accent:#ff7a3d; --accent-text:#1b1208;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f0a; --panel:#2a2418; --text:#fbf1d8; --muted:#c5b58f; --accent:#ff7a3d; --accent-text:#1b1208;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#stage canvas.gl{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);z-index:3}
#tl{position:absolute;left:10px;top:8px;width:112px}
#cbarwrap{display:none;height:9px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;border:2px solid rgba(255,255,255,.6);margin-top:3px}
#cbar{height:100%;width:100%;background:linear-gradient(#ff9ac4,#e8508f)}
#frost{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(200,230,255,0) 38%,rgba(190,225,255,.9) 100%);opacity:0;z-index:2}
#hpwrap{height:14px;border-radius:7px;background:rgba(0,0,0,.55);overflow:hidden;border:2px solid rgba(255,255,255,.65)}
#hp{height:100%;width:100%;background:linear-gradient(#ff7a6a,#d62f2f);transition:width .15s}
#stats{margin-top:4px;font-weight:800;font-size:15px;display:flex;gap:10px}
#quest{position:absolute;left:130px;right:80px;top:8px;background:rgba(15,15,20,.66);border:2px solid #ffd35a;border-radius:12px;padding:5px 8px 6px;display:flex;gap:8px;align-items:center}
#qmain{flex:1;min-width:0}
#qt{font-size:11px;font-weight:800;color:#ffd35a;letter-spacing:.2px}
#qo{font-size:13px;font-weight:700;line-height:1.2;margin-top:1px}
#qbar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:4px;overflow:hidden}
#qbar i{display:block;height:100%;width:0;background:#7be36b;transition:width .2s}
#compass{width:34px;text-align:center;font-size:10px;font-weight:800}
#arrow{display:block;font-size:24px;line-height:24px;color:#ffd35a;transform-origin:50% 50%}
#mini{position:absolute;right:8px;top:8px;width:60px;height:150px;border-radius:10px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35)}
#boss{position:absolute;left:24px;right:24px;top:92px;display:none;text-align:center;font-weight:900;font-size:13px}
#boss .bar{height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid #ff6a4a;overflow:hidden;margin-top:2px}
#boss i{display:block;height:100%;width:100%;background:linear-gradient(#ff5a3a,#a01818)}
#toast{position:absolute;left:50%;top:112px;transform:translateX(-50%);max-width:320px;text-align:center;background:rgba(15,15,20,.74);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#hurt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(220,0,0,.75) 100%);opacity:0;z-index:2}
button.act{position:absolute;z-index:4;border-radius:50%;border:4px solid #ffd35a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.55);touch-action:none;font-family:inherit}
button.act:active{transform:scale(.92)}
#bSwing{right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:84px;height:84px;font-size:38px;background:rgba(40,120,200,.85)}
#bGren{right:112px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:70px;height:70px;font-size:30px;background:rgba(200,50,20,.88)}
#bJump{right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:64px;height:64px;font-size:26px;background:rgba(60,160,80,.88)}
#bDash{right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:62px;height:62px;font-size:26px;background:rgba(235,170,20,.92)}
#bDash small,#bJump small,#bGren small,#bSwing small{display:block;font-size:10px;font-weight:800;margin-top:-4px}
#bCam{right:12px;top:168px;width:40px;height:40px;font-size:18px;border-width:2px;background:rgba(0,0,0,.45)}
#bPause{right:104px;top:168px;width:40px;height:40px;font-size:18px;border-width:2px;background:rgba(0,0,0,.45)}
#bEmote{right:150px;top:168px;width:40px;height:40px;font-size:18px;border-width:2px;background:rgba(0,0,0,.45)}
#bMute{right:58px;top:168px;width:40px;height:40px;font-size:18px;border-width:2px;background:rgba(0,0,0,.45)}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:56px;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);display:none;z-index:3;pointer-events:none}
#knob{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:25px;background:rgba(255,255,255,.65)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:6;padding:16px;box-sizing:border-box}
#overlay.hide{display:none}
body.inmenu #hud,body.inmenu button.act{visibility:hidden}
#overlay.peek{background:transparent;align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(80,0,0,.55);font-size:28px;font-weight:900;color:#fff;text-align:center;padding:20px}
.card{background:var(--panel);color:var(--text);border-radius:22px;padding:20px 20px 18px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font-size:27px;line-height:1.1;font-family:Impact,"Arial Black",sans-serif;letter-spacing:.5px}
.card p{margin:6px 0;line-height:1.4;font-size:15px}
.card ul{margin:8px 0;padding-left:20px;font-size:14.5px;line-height:1.45}
.card button.mode{display:flex;align-items:center;gap:12px;text-align:left;font-size:17px;padding:12px 14px;margin-top:8px;color:#fff}
.card button.mode .me{font-size:30px;line-height:1}
.card button.mode small{display:block;font-weight:600;font-size:12px;opacity:.9;margin-top:2px}
.card input[type=text]{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border-radius:12px;border:2px solid var(--muted);background:transparent;color:var(--text);margin:4px 0 8px;font-family:inherit;-webkit-user-select:text;user-select:text}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card .grid button{margin-top:0;font-size:14px;padding:10px 6px;line-height:1.2}
.card .row{display:flex;gap:8px;margin-top:10px}
.card .row button{flex:1;margin-top:0;padding:10px 6px;font-size:14px}
.card button.alt{background:transparent;color:var(--text);border:2px solid var(--muted)}
.card input[type=range]{accent-color:var(--accent);margin:4px 0 2px}
.card .muted{color:var(--muted);font-size:13px}
.card button{margin-top:10px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:900;font-size:19px;font-family:inherit}
.card button:active{transform:scale(.98)}
.big{font-size:40px;font-weight:900;margin:4px 0}
@media (min-width:700px){#quest{left:50%;right:auto;transform:translateX(-50%);width:440px}}
@media (prefers-reduced-motion: reduce){#toast,#hp,#qbar i{transition:none}}
</style>

<body>
<div id="stage">
  <div id="hurt"></div>
  <div id="frost"></div>
  <div id="hud">
    <div id="tl">
      <div id="hpwrap"><div id="hp"></div></div>
      <div id="cbarwrap"><div id="cbar"></div></div>
      <div id="stats"><span id="gr">💣 10</span><span id="kl">🧟 0</span><span id="fr"></span></div>
    </div>
    <div id="quest">
      <div id="qmain"><div id="qt"></div><div id="qo"></div><div id="qbar"><i></i></div></div>
      <div id="compass"><span id="arrow">▲</span><span id="dist"></span></div>
    </div>
    <canvas id="mini" width="120" height="300"></canvas>

  </div>
  <button class="act" id="bCam" aria-label="Recenter camera">🧭</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
if (!window.THREE){
  $("card").innerHTML = "<h1>3D engine did not load</h1><p>Check your connection and reload the page.</p>";
  return;
}
const THREE = window.THREE;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b - a) * t;
const hyp = Math.hypot;
const rnd = (a,b) => a + Math.random() * (b - a);
function angDiff(a,b){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; }
let seed = 4242;
function R(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b) => a + R() * (b - a);

/* ================= audio ================= */
let AC = null, muted = false;
function sfx(type){
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const cfg = {
      throw:[500,260,0.14,"triangle",0.12], boom:[150,28,0.45,"sawtooth",0.28],
      hurt:[220,70,0.25,"square",0.14], swing:[300,120,0.1,"triangle",0.08], jump:[250,520,0.14,"sine",0.09],
      hit:[180,90,0.12,"square",0.1], pick:[600,1000,0.15,"sine",0.14],
      win:[400,1000,0.5,"sine",0.2], gate:[120,300,0.6,"sawtooth",0.12], roar:[110,50,0.7,"sawtooth",0.2]
    }[type];
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = cfg[3];
    o.frequency.setValueAtTime(cfg[0], t);
    o.frequency.exponentialRampToValueAtTime(cfg[1], t + cfg[2]);
    g.gain.setValueAtTime(cfg[4], t);
    g.gain.exponentialRampToValueAtTime(0.001, t + cfg[2]);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + cfg[2] + 0.02);
  } catch (e) {}
}

/* ================= renderer / scene ================= */
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: (window.devicePixelRatio || 1) < 2, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.domElement.className = "gl";
stage.insertBefore(renderer.domElement, stage.firstChild);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 60, 190);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 68 : 55;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(30, 60, 20); scene.add(sun);
const lantern = new THREE.PointLight(0xffd8a0, 0, 32, 2); scene.add(lantern);
const fireLight = new THREE.PointLight(0xff8a30, 1.6, 34, 2); fireLight.position.set(0, 2.5, -190); scene.add(fireLight);
const boomLight = new THREE.PointLight(0xffa040, 0, 45, 2); scene.add(boomLight);

/* ================= helpers ================= */
const geoCache = {};
function gBox(w,h,d){ const k = w+","+h+","+d; return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(w,h,d)); }
const lam = (c,o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const bas = (c,o) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
function mesh(geo, mat, x, y, z){ const m = new THREE.Mesh(geo, mat); m.position.set(x||0, y||0, z||0); return m; }
function pivot(x,y,z){ const g = new THREE.Group(); g.position.set(x,y,z); return g; }
const instAll = [];
function instanced(geo, mat, list, parent){
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D(), col = new THREE.Color();
  list.forEach((o,i) => {
    d.position.set(o.x, o.y, o.z); d.rotation.set(o.rx||0, o.ry||0, o.rz||0); d.scale.set(o.sx||1, o.sy||1, o.sz||1);
    d.updateMatrix(); im.setMatrixAt(i, d.matrix);
    if (o.c !== undefined){ col.setHex(o.c); im.setColorAt(i, col); }
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.frustumCulled = false;
  (parent || scene).add(im); if (!parent) instAll.push(im); return im;
}
function makeSign(text, w, h, bg, fg){
  const c = document.createElement("canvas"); c.width = 512; c.height = Math.round(512 * h / w);
  const x = c.getContext("2d");
  x.fillStyle = bg; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle = fg; x.lineWidth = 10; x.strokeRect(8,8,c.width-16,c.height-16);
  x.fillStyle = fg; x.font = "900 " + Math.round(c.height*0.5) + "px Impact, 'Arial Black', sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, c.width/2, c.height/2 + 4);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
  return m;
}
function beam(color, h){
  const m = mesh(new THREE.CylinderGeometry(0.45,0.45,h,8,1,true), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.28, depthWrite:false, fog:false }), 0, h/2, 0);
  return m;
}

/* ================= colliders ================= */
const circles = [], rects = [];
const BND = { x0: -35.5, x1: 35.5, z0: -306, z1: 210 };
function addCircle(x,z,r,h){ const c = { x, z, r }; if (h !== undefined) c.h = h; circles.push(c); return c; }
function addRect(x1,x2,z1,z2){ const q = { x1, x2, z1, z2, on: true }; rects.push(q); return q; }
function collide(e, r){
  for (const c of circles){
    if (c.h !== undefined && (e.jy || 0) > c.h) continue;
    const dx = e.x - c.x, dz = e.z - c.z, rr2 = r + c.r, d2 = dx*dx + dz*dz;
    if (d2 < rr2*rr2 && d2 > 1e-6){ const d = Math.sqrt(d2), k = (rr2 - d) / d; e.x += dx*k; e.z += dz*k; }
  }
  for (const q of rects){
    if (!q.on) continue;
    const cx = clamp(e.x, q.x1, q.x2), cz = clamp(e.z, q.z1, q.z2);
    const dx = e.x - cx, dz = e.z - cz, d2 = dx*dx + dz*dz;
    if (d2 < r*r){
      if (d2 > 1e-6){ const d = Math.sqrt(d2), k = (r - d) / d; e.x += dx*k; e.z += dz*k; }
      else {
        const l = e.x - q.x1, rt = q.x2 - e.x, t = e.z - q.z1, b = q.z2 - e.z, m = Math.min(l,rt,t,b);
        if (m === l) e.x = q.x1 - r; else if (m === rt) e.x = q.x2 + r; else if (m === t) e.z = q.z1 - r; else e.z = q.z2 + r;
      }
    }
  }
  e.x = clamp(e.x, BND.x0, BND.x1); e.z = clamp(e.z, BND.z0, BND.z1);
}
function groundY(x,z){ return (z > 12 && z < 32 && Math.abs(x) < 4.4) ? 0.2 : 0; }

/* ================= world layout ================= */
const GATE_Z = [34, -70, -150, -230, 104];
const BAN = [[-20,-12],[24,-34],[-6,-50]];
const TOT = [[-20,-95],[22,-110],[-8,-135]];
const CAMP = [0,-190];
const CAGE = [0,-298];
const PONDS = [[14,-8,5.5],[-20,-30,6.5],[18,-52,5]];
const PICKS = [
  ["ammo",-8,70],["ammo",14,50],["health",10,80],
  ["ammo",-12,-5],["ammo",10,-25],["ammo",-4,-55],["health",16,-20],["health",-18,-48],
  ["ammo",-10,-80],["ammo",12,-95],["ammo",-14,-120],["ammo",15,-135],["health",0,-100],["health",6,-128],
  ["ammo",-12,-165],["ammo",14,-178],["ammo",-10,-205],["ammo",12,-215],["health",-6,-185],["health",8,-200],
  ["ammo",-14,-250],["ammo",14,-255],["ammo",-10,-285],["ammo",10,-285],["health",-16,-270],["health",16,-270]
];
const keyPts = [];
BAN.forEach(b => keyPts.push({x:b[0],z:b[1],r:3}));
TOT.forEach(b => keyPts.push({x:b[0],z:b[1],r:4}));
PONDS.forEach(b => keyPts.push({x:b[0],z:b[1],r:b[2]+1.5}));
PICKS.forEach(b => keyPts.push({x:b[1],z:b[2],r:2.5}));
keyPts.push({x:CAMP[0],z:CAMP[1],r:16},{x:CAGE[0],z:CAGE[1],r:6},{x:0,z:-272,r:26},{x:-22,z:62,r:11},{x:22,z:62,r:10});
GATE_Z.forEach(z => keyPts.push({x:0,z:z,r:9}));
keyPts.push({x:0,z:186,r:27},{x:0,z:204,r:6},{x:-16,z:140,r:11});
function clearOf(x,z,pad){ for (const k of keyPts){ if (hyp(x-k.x, z-k.z) < k.r + (pad||0)) return false; } return true; }
function scatter(n, zA, zB, o){
  o = o || {}; const out = []; let tries = 0;
  while (out.length < n && tries < n * 40){
    tries++;
    const x = rr(-34,34), z = rr(zB + 3, zA - 3);
    if (Math.abs(x) < (o.path || 6)) continue;
    if (!clearOf(x,z,o.pad || 1.5)) continue;
    if (out.some(p => hyp(p.x-x, p.z-z) < (o.sep || 4))) continue;
    out.push({ x, z, s: rr(o.s0 || 0.8, o.s1 || 1.3) });
  }
  return out;
}

/* ================= ground ================= */
const ZG = [

  pl.legL.rotation.x = sw; pl.legR.rotation.x = -sw;
  pl.armL.rotation.x = -sw * 0.8;
  if (P.swing > 0){ const k = 1 - P.swing / 0.3; pl.armR.rotation.x = -2.6 + k * 3.4; }
  else pl.armR.rotation.x = sw * 0.8;
  pl.g.visible = !(P.inv > 0 && Math.sin(S.time * 40) > 0);
}

function updateZombies(dt){
  zombies.slice().forEach(z => {
    const dx = P.x - z.x, dz = P.z - z.z, d = hyp(dx, dz);
    if (z.type !== "boss" && z.type !== "tiger" && d > 105){ removeZombie(z); return; }
    if (z.type === "boss" && !S.bossOn && d > 60) return;
    if (z.type === "tiger" && !S.bossOn){ z.g.position.set(z.x, 0, z.z); return; }
    if (z.flash > 0){ z.flash -= dt; z.parts.forEach(m => { m.material = z.flash > 0 ? flashMat : m.userData.om; }); }
    if (z.rise > 0){
      z.rise -= dt; z.g.position.y = -2.5 * Math.max(0, z.rise / z.riseMax);
      if (z.rise <= 0) z.g.position.y = 0;
      return;
    }
    z.atkCd -= dt;
    // knockback
    if (Math.abs(z.kx) + Math.abs(z.kz) > 0.1){
      z.x += z.kx * dt; z.z += z.kz * dt; z.kx *= Math.max(0, 1 - 8*dt); z.kz *= Math.max(0, 1 - 8*dt);
    }
    let speed = 0, face = true;
    if (z.type === "boss"){
      z.slamCd -= dt; z.chargeCd -= dt;
      if (z.slamT > 0){
        z.slamT -= dt; telegraph.visible = true; telegraph.position.set(z.x, 0.12, z.z); telegraph.scale.setScalar(6.5);
        z.parts.forEach(m => { m.material = (Math.sin(S.time*30) > 0) ? flashMat : m.userData.om; });
        if (z.slamT <= 0){
          telegraph.visible = false; S.shake = 1.1; sfx("boom");
          burst(z.x, 0.5, z.z, 0x998877, 16, 8, 0.6);
          if (hyp(P.x-z.x, P.z-z.z) < 6.8) hurt(26);
          z.slamCd = 3.5; z.parts.forEach(m => { m.material = m.userData.om; });
        }
        face = false;
      } else if (z.chargeWind > 0){
        z.chargeWind -= dt;
        z.parts.forEach(m => { m.material = (Math.sin(S.time*30) > 0) ? flashMat : m.userData.om; });
        if (z.chargeWind <= 0){ z.chargeT = 0.9; const l = d || 1; z.cdx = dx/l; z.cdz = dz/l; z.hit = false; z.parts.forEach(m => { m.material = m.userData.om; }); }
      } else if (z.chargeT > 0){
        z.chargeT -= dt; z.x += z.cdx * 15 * dt; z.z += z.cdz * 15 * dt; face = false;
        z.g.rotation.y = Math.atan2(z.cdx, z.cdz); speed = 8;
        if (!z.hit && d < z.r + 1){ z.hit = true; hurt(24); }
        if (z.chargeT <= 0) z.chargeCd = 9;
      } else if (d < 5.5 && z.slamCd <= 0){ z.slamT = 0.8; sfx("roar"); }
      else if (d > 11 && z.chargeCd <= 0){ z.chargeWind = 0.8; sfx("roar"); }
      else if (d > 3.6){ speed = z.spd; }
      else if (z.atkCd <= 0){ z.atkCd = 1.3; if (d < z.r + 1.6) hurt(z.dmg); }
    } else if (z.type === "tiger"){
      const tr = tigerAI(z, dt, dx, dz, d); speed = tr.speed; face = tr.face;
    } else {
      if (z.state === "idle"){
        if (d < z.aggro) z.state = "chase";
        else {
          z.wt -= dt;
          if (z.wt <= 0){ z.wx = z.x + rnd(-8,8); z.wz = z.z + rnd(-8,8); z.wt = rnd(2,5); }
          const wdx = z.wx - z.x, wdz = z.wz - z.z, wd = hyp(wdx, wdz);
          if (wd > 1){ z.x += wdx/wd * 1.2 * dt; z.z += wdz/wd * 1.2 * dt; z.dir = Math.atan2(wdx, wdz); speed = 1.2; }
          z.g.rotation.y += angDiff(z.g.rotation.y, z.dir) * Math.min(1, dt*6);
          face = false;
        }
      }
      if (z.state === "chase"){
        if (z.wind > 0){
          z.wind -= dt;
          if (z.wind <= 0){ if (d < z.r + 1.9) hurt(z.dmg); z.atkCd = 1.0; }
        } else if (d > z.r + 1.4){ speed = z.spd; }
        else if (z.atkCd <= 0){ z.wind = 0.35; }
        if (d > 70) z.state = "idle";
      }
    }
    if (speed > 0 && face && (z.state === "chase" || z.type === "boss" || z.type === "tiger")){
      z.x += dx/(d||1) * speed * dt; z.z += dz/(d||1) * speed * dt;
    }
    if (face && z.wind <= 0 && z.slamT <= 0 && z.state === "chase"){
      const ang = Math.atan2(dx, dz); z.g.rotation.y += angDiff(z.g.rotation.y, ang) * Math.min(1, dt * 9);
    }
    // separation
    for (let k = 0; k < zombies.length; k++){
      const o = zombies[k]; if (o === z) continue;
      const ox = z.x - o.x, oz = z.z - o.z, od = hyp(ox, oz), min = (z.r + o.r) * 0.9;
      if (od < min && od > 0.001){ const p = (min - od) * 0.5; z.x += ox/od*p; z.z += oz/od*p; }
    }
    const hd = hyp(P.x - z.x, P.z - z.z), pm = z.r + 0.6;
    if (hd < pm && hd > 0.001){ const p = (pm - hd); z.x -= (P.x - z.x)/hd * p * 0.3; z.z -= (P.z - z.z)/hd * p * 0.3; }
    collide(z, z.r * 0.8);
    z.walk += dt * (speed > 0 ? speed * 2.4 : 0);
    const sw = speed > 0 ? Math.sin(z.walk) * 0.7 : 0;
    z.legL.rotation.x = sw; z.legR.rotation.x = -sw;
    if (z.legs4){ z.legs4[0].rotation.x = sw; z.legs4[3].rotation.x = sw; z.legs4[1].rotation.x = -sw; z.legs4[2].rotation.x = -sw; }
    const lunge = z.wind > 0 ? -1.9 : -1.35 + Math.sin(z.walk * 0.5) * 0.12;
    z.armL.rotation.x = lunge; z.armR.rotation.x = lunge;
    z.g.position.set(z.x, groundY(z.x, z.z) + (z.air || 0), z.z);
  });
}

function updateGrenades(dt){
  for (let i = grens.length - 1; i >= 0; i--){
    const g = grens[i];
    g.vy -= g.g * dt; g.x += g.vx*dt; g.z += g.vz*dt; g.y += g.vy*dt;
    g.m.position.set(g.x, g.y, g.z); g.m.rotation.x += dt*10;
    if (g.y <= 0.3 && g.vy < 0){ scene.remove(g.m); grens.splice(i, 1); explode(g.x, 0.3, g.z); }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    if (p.grow){
      const k = 1 - p.life / p.max; p.m.scale.setScalar(1 + k * 6.5); p.m.material.opacity = 0.75 * (1 - k);
    } else {
      p.vy -= 22 * dt; p.m.position.x += p.vx*dt; p.m.position.y = Math.max(0.1, p.m.position.y + p.vy*dt); p.m.position.z += p.vz*dt;
      p.m.scale.setScalar(Math.max(0.01, p.life / p.max));
    }
    if (p.life <= 0){ scene.remove(p.m); parts.splice(i, 1); }
  }
  S.boomT = Math.max(0, S.boomT - dt); boomLight.intensity = S.boomT > 0 ? 3.2 * (S.boomT / 0.25) : 0;
  shardTick(dt);
}

function updateWorld(dt, t){
  // pickups
  for (let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i]; p.t += dt;
    p.g.position.y = 0.9 + Math.sin(p.t*3) * 0.15; p.g.rotation.y += dt * 1.5;
    if (hyp(p.x-P.x, p.z-P.z) < 1.9){
      if (p.kind === "ammo"){ if (P.gren >= 15) continue; P.gren = Math.min(15, P.gren + 3); toast("+3 grenades", 1.4); }
      else { if (P.hp >= P.maxhp) continue; P.hp = Math.min(P.maxhp, P.hp + 35); toast("+35 health", 1.4); }
      sfx("pick"); scene.remove(p.g); pickups.splice(i, 1);
    }
  }
  bananas.forEach(b => { if (!b.got){ b.bm.rotation.y += dt * 2; b.g.position.y = Math.sin(t*3) * 0.15; } });
  totems.forEach(tt => {
    if (tt.dead) return;
    tt.orb.position.y = 5.3 + Math.sin(t*2 + tt.x) * 0.25; tt.orb.rotation.y += dt;
    if (tt.flash > 0){ tt.flash -= dt; tt.ob.material.emissive.setHex(0xffffff); } else tt.ob.material.emissive.setHex(0x4a0a96);
  });
  gates.forEach(g => {
    if (!g.open) g.bar.material.opacity = 0.3 + Math.sin(t*4 + g.i) * 0.1;
    else if (g.opening){
      g.bar.scale.y -= dt * 1.4; g.bar.position.y = (g.h * g.bar.scale.y) / 2;
      if (g.bar.scale.y <= 0.02){ g.opening = false; g.bar.visible = false; }
    }
  });
  // fire
  const fl = 1 + Math.sin(t*17) * 0.12 + Math.sin(t*9.3) * 0.1;
  flameA.scale.set(1, fl, 1); flameB.scale.set(1, 2 - fl, 1);
  fireLight.intensity = 1.6 + Math.sin(t*13) * 0.35;
  // river
  const pa = riverGeo.attributes.position;
  for (let i = 0; i < pa.count; i++) pa.setZ(i, Math.sin(pa.getX(i)*0.25 + t*2) * 0.12);
  pa.needsUpdate = true;
  // fireflies
  flies.position.y = Math.sin(t*0.8) * 0.4; flies.rotation.y = Math.sin(t*0.1) * 0.03;
  // zoo monkeys
  zooMonkeys.forEach(zm => {
    zm.t -= dt;
    if (zm.t <= 0){ zm.tx = -22 + rnd(-5.5,5.5); zm.tz = 62 + rnd(-4.5,4.5); zm.t = rnd(1.5,4); zm.hop = 0.5; }
    const dx = zm.tx - zm.x, dz = zm.tz - zm.z, d = hyp(dx, dz);
    if (d > 0.4){ zm.x += dx/d*2.2*dt; zm.z += dz/d*2.2*dt; zm.m.g.rotation.y = Math.atan2(dx, dz); }
    zm.hop = Math.max(0, zm.hop - dt);
    zm.m.g.position.set(zm.x, d > 0.4 ? Math.abs(Math.sin(t*9 + zm.x)) * 0.35 : 0, zm.z);
    zm.m.tail.rotation.x = -0.5 + Math.sin(t*4 + zm.z) * 0.3;
  });
  // coco
  if (S.game === "escape"){ /* Coco is the player */ }
  else if (C.follow){
    const bx = P.x - P.mv.x * 2.4 + P.mv.z * 1.2, bz = P.z - P.mv.z * 2.4 - P.mv.x * 1.2;
    const dx = bx - C.x, dz = bz - C.z, d = hyp(dx, dz);
    if (hyp(P.x-C.x, P.z-C.z) > 40){ C.x = P.x; C.z = P.z + 3; }
    else if (d > 0.8){ const sp = clamp(d * 3.5, 0, 11); C.x += dx/d*sp*dt; C.z += dz/d*sp*dt; coco.g.rotation.y = Math.atan2(dx, dz); }
    collide(C, 0.4);
    C.t += dt * (d > 0.8 ? 12 : 0);
    coco.g.position.set(C.x, groundY(C.x, C.z) + Math.abs(Math.sin(C.t)) * 0.4, C.z);
    const sw = d > 0.8 ? Math.sin(C.t) * 0.8 : 0;
    coco.legL.rotation.x = sw; coco.legR.rotation.x = -sw; coco.armL.rotation.x = -sw; coco.armR.rotation.x = sw;
    coco.tail.rotation.x = -0.5 + Math.sin(t*6) * 0.3;
  } else if (C.carry){
    coco.g.position.set(C.carry.x, 2.7, C.carry.z); coco.g.rotation.y = C.carry.g.rotation.y;
    coco.armL.rotation.x = -2.5 + Math.sin(t*12) * 0.4; coco.armR.rotation.x = -2.5 - Math.sin(t*12) * 0.4;
  } else if (C.ice){
    coco.g.position.set(0, 0.5 + Math.abs(Math.sin(t*3)) * 0.1, 204); coco.g.rotation.y = Math.PI;
    coco.armL.rotation.x = -2.5 + Math.sin(t*5) * 0.3; coco.armR.rotation.x = -2.5 - Math.sin(t*5) * 0.3;
  } else {
    coco.g.position.set(CAGE[0], 0.5 + Math.abs(Math.sin(t*3)) * 0.15, CAGE[1]);
    coco.armL.rotation.x = -2.5 + Math.sin(t*5) * 0.3; coco.armR.rotation.x = -2.5 - Math.sin(t*5) * 0.3;
    coco.g.rotation.y = Math.PI;
  }
  // intro zombie
  if (intro){
    intro.z -= 8 * dt; intro.t += dt * 14;
    intro.g.position.set(0, 0, intro.z);
    intro.legL.rotation.x = Math.sin(intro.t) * 0.8; intro.legR.rotation.x = -Math.sin(intro.t) * 0.8;
    intro.mk.armL.rotation.x = -2.6 + Math.sin(intro.t) * 0.4; intro.mk.armR.rotation.x = -2.6 - Math.sin(intro.t) * 0.4;
    if (intro.z < -70){ scene.remove(intro.g); intro = null; }
  }
  stealTick(dt);
  snowTick(dt);
}

function updateCamera(dt){
  if (S.preview){ S.yaw += dt * 0.7; S.yawGoal = null; }
  if (S.yawGoal !== null){
    const d = angDiff(S.yaw, S.yawGoal); S.yaw += d * Math.min(1, dt * 3.5);
    if (Math.abs(d) < 0.02) S.yawGoal = null;
  }
  const D = S.preview ? 6.5 : 11, pitch = S.preview ? 0.22 : 0.52;
  const ox = Math.sin(S.yaw) * Math.cos(pitch) * D, oz = Math.cos(S.yaw) * Math.cos(pitch) * D, oy = Math.sin(pitch) * D + 1.2;
  const want = new THREE.Vector3(P.x + ox, P.y + oy, P.z + oz);
  camPos.lerp(want, 1 - Math.exp(-12 * dt));
  const sh = S.shake; S.shake = Math.max(0, S.shake - dt * 2.4);
  camera.position.set(camPos.x + (Math.random()-0.5)*sh*0.6, camPos.y + (Math.random()-0.5)*sh*0.6, camPos.z + (Math.random()-0.5)*sh*0.6);
  const la = S.preview ? 0 : 3;
  camera.lookAt(P.x - Math.sin(S.yaw) * la, P.y + (S.preview ? 0.8 : 1.5), P.z - Math.cos(S.yaw) * la);
}

function updateHUD(){

  if (S.game === "escape"){ escapeHUD(); return; }
  elHp.style.width = Math.max(0, P.hp / P.maxhp * 100) + "%";

  const ch = CH[Math.min(S.stage, CH.length - 1)];

    const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw), rx = Math.cos(S.yaw), rz = -Math.sin(S.yaw);
    const ang = Math.atan2(dx*rx + dz*rz, dx*fx + dz*fz);
    elArrow.style.transform = "rotate(" + ang + "rad)";

  }
  if (S.bossOn && S.boss) elBossBar.style.width = Math.max(0, S.boss.hp / S.boss.maxhp * 100) + "%";
  if (S.toastT > 0){ S.toastT -= 1/60; if (S.toastT <= 0) elToast.classList.remove("on"); }
  P.hurtA = Math.max(0, P.hurtA - 0.03); elHurt.style.opacity = P.hurtA;

let mf = 0;
function drawMini(t){
  const c = mctx, W = 120, H = 300;
  if (S.game === "cold"){ drawMiniCold(c, W, H, t); return; }
  c.clearRect(0,0,W,H);
  const Y = z => (215 - z) / 525 * H, X = x => 60 + x * (W / 80);
  const cols = ["#dce9f2","#6fbf5a","#2f86d0","#4f6b3b","#3d3849","#22382a","#4b2d2d"];
  const edges = [215,100,32,12,-70,-150,-230,-310];
  for (let i = 0; i < 7; i++){ c.fillStyle = cols[i]; c.fillRect(0, Y(edges[i]), W, Y(edges[i+1]) - Y(edges[i])); }
  gates.forEach(g => { c.fillStyle = g.open ? "#5fe36b" : "#ff4a3a"; c.fillRect(30, Y(g.z) - 2, 60, 4); });
  const tp = targetPos();
  if (tp){ c.fillStyle = "rgba(255,211,90," + (0.6 + Math.sin(t*6)*0.4) + ")"; c.beginPath(); c.arc(X(tp.x), Y(tp.z), 8, 0, 7); c.fill(); }
  c.fillStyle = "#ff5a4a";
  zombies.forEach(z => { if (hyp(z.x-P.x, z.z-P.z) < 55){ c.beginPath(); c.arc(X(z.x), Y(z.z), 3, 0, 7); c.fill(); } });
  c.fillStyle = "#6af0ff"; c.beginPath(); c.arc(X(P.x), Y(P.z), 6, 0, 7); c.fill();
  c.strokeStyle = "#fff"; c.lineWidth = 2; c.stroke();
}

/* ================= main loop ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (S.mode === "play"){
    S.time += dt; perfTick(dt);
    updatePlayer(dt);
    if (S.game === "cold"){ coldTick(dt); updateGrenades(dt); }
    else { ambient(dt); updateZombies(dt); updateGrenades(dt); if (S.game === "escape") escapeTick(dt); else questTick(dt); }
    const zi = S.game === "cold" ? 7 : zoneIdx(P.z);
    if (zi !== S.lastZone){ S.lastZone = zi; if (S.time > 1 && ZNAMES[zi]) toast("📍 " + ZNAMES[zi], 2.2); }
    lantern.position.set(P.x, 3.5, P.z); lantern.intensity = clamp((0.85 - atmoHi) * 3.5, 0, 1.7);
  } else if (S.mode === "dead"){
    S.deadT -= dt; updateGrenades(dt);
    if (S.deadT <= 0) respawn();
  } else if (S.mode === "menu"){
    menuT += dt; if (!S.preview) S.yaw = Math.sin(menuT * 0.25) * 0.5;
    updateGrenades(dt);
  }
  updateWorld(dt, t);
  if (S.game === "cold") coldVisuals(dt, t);
  netTick(dt);
  updateCamera(dt);
  atmosphere(P.z);
  if (S.game === "cold") coldAtmo();
  stars.position.copy(camera.position);
  moon.position.set(camera.position.x - 80, camera.position.y + 120, camera.position.z - 200);
  updateHUD(); dashUI();
  document.body.classList.toggle("inmenu", S.mode === "menu");
  if ((mf++ % 3) === 0) drawMini(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const JR = 56;
let camDrag = null;
stage.addEventListener("pointerdown", e => {
  if (S.mode !== "play") return;
  if (e.target.closest("button")) return;
  const sr = stage.getBoundingClientRect();
  const left = (e.clientX - sr.left) < sr.width / 2 && e.pointerType !== "mouse";
  if (left && !joy.on){
    joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = 0; joy.y = 0;
    const j = $("joy"); j.style.display = "block"; j.style.left = (e.clientX - sr.left) + "px"; j.style.top = (e.clientY - sr.top) + "px";
    $("knob").style.transform = "translate(0,0)";
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (!camDrag){
    camDrag = { id: e.pointerId, x: e.clientX, moved: 0, t: performance.now() };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
stage.addEventListener("pointermove", e => {
  if (joy.on && e.pointerId === joy.id){
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const l = hyp(dx, dy);
    if (l > JR){ dx = dx / l * JR; dy = dy / l * JR; }
    joy.x = dx / JR; joy.y = dy / JR;
    $("knob").style.transform = "translate(" + dx + "px," + dy + "px)";
  } else if (camDrag && e.pointerId === camDrag.id){
    const dx = e.clientX - camDrag.x; camDrag.x = e.clientX; camDrag.moved += Math.abs(dx);
    S.yaw += dx * 0.0065 * settings.sens; S.yawGoal = null;
  }
});
function endPtr(e){
  if (joy.on && e.pointerId === joy.id){ joy.on = false; joy.x = 0; joy.y = 0; $("joy").style.display = "none"; }
  if (camDrag && e.pointerId === camDrag.id){
    if (camDrag.moved < 8 && performance.now() - camDrag.t < 350) swing();
    camDrag = null;
  }
}
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("contextmenu", e => e.preventDefault());
function btn(id, fn){ $(id).addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); fn(); }); }
btn("bSwing", swing); btn("bGren", throwGren); btn("bCam", recenter); btn("bJump", jump); btn("bDash", dash);
$("bMute").addEventListener("click", () => { setSound(!settings.sound); });
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === " "){ e.preventDefault(); jump(); }
  if (k === "j"){ swing(); }
  if (k === "shift" || k === "k"){ dash(); }
  if (k === "g" || k === "f"){ throwGren(); }
  if (k === "r"){ recenter(); }
  if (k.indexOf("arrow") === 0) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  const patch = live
    ? { g: S.game, x: +P.x.toFixed(1), z: +P.z.toFixed(1), j: +(P.jy || 0).toFixed(2), h: +P.heading.toFixed(2), o: S.game === "escape" ? "coco" : settings.outfit, n: settings.nick || "" }
    : { g: "menu", n: settings.nick || "" };
  room.presence(patch).catch(() => {});
}
function sendEmote(){
  if (!room) return;
  const k = EMOTES[emoteIdx++ % EMOTES.length];
  popEmoji(pl.g, k, S.game === "escape" ? 3.4 : 4.4);
  room.emit("emote", { k }).catch(() => {});
}
function netTick(dt){
  // floating emoji
  for (let i = pops.length - 1; i >= 0; i--){
    const q = pops[i]; q.t += dt; q.sp.position.y += dt * 0.8; q.sp.material.opacity = clamp(1 - (q.t - 1.4) / 0.8, 0, 1);
    if (q.t > 2.2){ q.g.remove(q.sp); pops.splice(i, 1); }
  }
  if (!room) return;
  netAcc += dt; if (netAcc >= 0.1){ netAcc = 0; sendPresence(); }
  netPeers.forEach((p, idx) => {
    let r = remotes.get(p.peer); if (!r) return;
    const pr = p.presence, want = outfitKind(pr.o);
    if (r.kind !== want){ dropRemote(p.peer); r = makeRemote(p); }
    r.g.visible = pr.g === S.game && S.mode !== "menu";
    r.tx = +pr.x || 0; r.tz = +pr.z || 0; r.th = +pr.h || 0; r.jy = +pr.j || 0;
    if (hyp(r.tx - r.x, r.tz - r.z) > 30){ r.x = r.tx; r.z = r.tz; }
    const k = Math.min(1, dt * 12), ox = r.x, oz = r.z;
    r.x += (r.tx - r.x) * k; r.z += (r.tz - r.z) * k;
    r.g.rotation.y += angDiff(r.g.rotation.y, r.th) * k;
    const moved = hyp(r.x - ox, r.z - oz);
    if (moved > 0.02) r.step += dt * 11;
    const sw = moved > 0.02 ? Math.sin(r.step) * 0.8 : 0;
    r.m.legL.rotation.x = sw; r.m.legR.rotation.x = -sw; r.m.armL.rotation.x = -sw * 0.8;
    r.g.position.set(r.x, groundY(r.x, r.z) + r.jy, r.z);
    setLabel(r, names.get(p.by) || (typeof pr.n === "string" && pr.n ? pr.n.slice(0, 12) : "Friend " + (idx + 1)));
  });
}
function attachRoom(rm, kind){
  leaveRoom();
  room = rm; roomKind = kind;
  room.onPeers(onPeersChange);
  room.on("emote", m => {
    if (m.isMe) return;
    const r = remotes.get(m.peer);
    if (r && m.data && EMOTES.indexOf(m.data.k) >= 0) popEmoji(r.g, m.data.k, r.kind === "coco" ? 3.4 : 4.4);
  });
  sendPresence();
}
function leaveRoom(){
  if (room && room.leave){ try { room.leave(); } catch (e) {} }
  room = null; roomKind = ""; netPeers = [];
  Array.from(remotes.keys()).forEach(dropRemote);
  $("fr").textContent = ""; $("bEmote").style.display = "none";
}
async function initNet(){
  try {
    if (!window.claude || !window.claude.use) return;
    const rm = await window.claude.use("room"); if (!rm) return;
    try { userCap = await window.claude.use("user"); } catch (e) { userCap = null; }
    attachRoom(rm, "claude");
  } catch (e) { room = null; roomKind = ""; }
}
$("bEmote").addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); sendEmote(); });

/* ---- friends through a free public message server (MQTT over WebSocket) ---- */
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
const MQTT_URLS = ["https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js", "https://unpkg.com/mqtt@5/dist/mqtt.min.js"];
function loadMqtt(){
  if (window.mqtt) return Promise.resolve();
  return new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (i >= MQTT_URLS.length) return reject(new Error("load"));
      const sc = document.createElement("script"); sc.src = MQTT_URLS[i++];
      sc.onload = () => (window.mqtt ? resolve() : next()); sc.onerror = next; document.head.appendChild(sc);
    };
    next();
  });
}
function connectBroker(url, id, code){
  return new Promise((resolve, reject) => {
    let done = false;
    const client = window.mqtt.connect(url, { clientId: "cq_" + id, clean: true, reconnectPeriod: 0, connectTimeout: 6000,
      will: { topic: "morecheezmo/cq1/" + code + "/p/" + id, payload: "", qos: 0, retain: false } });
    const fail = () => { if (done) return; done = true; clearTimeout(t); try { client.end(true); } catch (e) {} reject(new Error("connect")); };
    const t = setTimeout(fail, 7000);
    client.on("connect", () => { if (done) return; done = true; clearTimeout(t); try { client.options.reconnectPeriod = 2000; } catch (e) {} resolve(client); });
    client.on("error", fail);
  });
}
function makeMqttRoom(client, code, id){
  const base = "morecheezmo/cq1/" + code, myTopic = base + "/p/" + id;
  const state = {}, peersMap = new Map(), peerHandlers = [], topicHandlers = {};
  let dirty = true, lastPub = 0;
  const list = () => Array.from(peersMap.entries()).map(en => ({ peer: en[0], by: null, isMe: false, kind: "viewer", guest: false, presence: en[1].presence }));
  const changed = () => { const l = list(); peerHandlers.forEach(h => h({ peers: l })); };
  client.subscribe([base + "/p/+", base + "/e"]);
  client.on("message", (topic, payload) => {
    const txt = String(payload);
    if (topic.indexOf(base + "/p/") === 0){
      const pid = topic.slice(base.length + 3);
      if (pid === id) return;
      if (!txt){ if (peersMap.delete(pid)) changed(); return; }
      let pr; try { pr = JSON.parse(txt); } catch (e) { return; }
      if (!pr || typeof pr !== "object") return;
      peersMap.set(pid, { presence: pr, seen: Date.now() }); changed();
    } else if (topic === base + "/e"){
      let m; try { m = JSON.parse(txt); } catch (e) { return; }
      if (!m || m.id === id || typeof m.t !== "string") return;
      (topicHandlers[m.t] || []).forEach(h => h({ isMe: false, peer: m.id, data: m.d }));
    }
  });
  const pubTimer = setInterval(() => {
    const now = Date.now();
    if (dirty || now - lastPub > 1500){ dirty = false; lastPub = now; try { client.publish(myTopic, JSON.stringify(state), { qos: 0 }); } catch (e) {} }
  }, 120);
  const expTimer = setInterval(() => {
    const now = Date.now(); let any = false;
    peersMap.forEach((v, k) => { if (now - v.seen > 5000){ peersMap.delete(k); any = true; } });
    if (any) changed();
  }, 1000);
  return {
    onPeers(h){ peerHandlers.push(h); h({ peers: list() }); return () => { const i = peerHandlers.indexOf(h); if (i >= 0) peerHandlers.splice(i, 1); }; },
    on(t, h){ (topicHandlers[t] = topicHandlers[t] || []).push(h); return () => {}; },
    presence(patch){ Object.keys(patch).forEach(k => { if (state[k] !== patch[k]){ state[k] = patch[k]; dirty = true; } }); return Promise.resolve(); },
    emit(t, d){ try { client.publish(base + "/e", JSON.stringify({ t, id, d }), { qos: 0 }); } catch (e) {} return Promise.resolve(); },
    leave(){ clearInterval(pubTimer); clearInterval(expTimer); try { client.publish(myTopic, "", { qos: 0 }); client.end(); } catch (e) {} }
  };
}
async function joinFriends(codeRaw, nickRaw){
  const code = String(codeRaw || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12);
  if (code.length < 3) throw new Error("code");
  settings.room = code; settings.nick = String(nickRaw || "").trim().slice(0, 12); saveSettings();
  await loadMqtt();
  const id = Math.random().toString(36).slice(2, 10);
  let client = null;
  for (const url of BROKERS){ try { client = await connectBroker(url, id, code); break; } catch (e) {} }
  if (!client) throw new Error("connect");
  attachRoom(makeMqttRoom(client, code, id), "mqtt");
}
function showFriends(back){
  const on1 = roomKind === "mqtt";
  if (roomKind === "claude"){
    show("<h1>👥 Play with friends</h1><p>You are connected through Claude. Everyone who opens the shared Claude link is in the same room automatically.</p><p class='muted'>To play from a public website link instead, open the game from that link.</p><button id='fb'>Back</button>");
    on("fb", back); return;
  }
  show("<h1>👥 Play with friends</h1><p>Everyone types the <b>same room code</b>, then picks the same game mode. You will see each other as characters.</p>" +
    "<p class='muted' style='margin-bottom:0'>Your name</p><input id='nick' type='text' maxlength='12' value='" + settings.nick.replace(/[^\w \-]/g, "") + "' placeholder='Your name'>" +
    "<p class='muted' style='margin-bottom:0'>Room code (letters and numbers)</p><input id='rcode' type='text' maxlength='12' value='" + settings.room + "' placeholder='for example: zoo4821' autocapitalize='none'>" +
    (on1 ? "<p><b>Connected to room " + settings.room + ".</b> Send this code to friends.</p>" : "") +
    "<button id='fj'>" + (on1 ? "Reconnect" : "Join room") + "</button>" + (on1 ? "<button id='fl' class='alt'>Leave room</button>" : "") +
    "<p id='fs' class='muted'></p><button id='fb' class='alt'>Back</button>");
  on("fb", back);
  on("fl", () => { leaveRoom(); showFriends(back); });
  on("fj", async () => {
    const st = $("fs"), btn = $("fj"); btn.disabled = true; st.textContent = "Connecting…";
    try { await joinFriends($("rcode").value, $("nick").value); showFriends(back); }
    catch (e) {
      st.textContent = e.message === "code" ? "Use a room code with at least 3 letters or numbers." : "Could not connect. Check your internet and try again in a minute.";
      btn.disabled = false;
    }
  });
}

function startGame(sv){
  overlay.classList.add("hide");
  S.mode = "play"; S.yaw = 0; S.time = 0;
  if (sv){
    applySave(sv);
    toast("Welcome back! Continuing your quest.", 3.5);
  } else {
    camPos.set(P.x, 8, P.z + 10);
    toast("Coco was taken across the bridge! Defeat the zoo zombies to open the gate.", 5);
    const b = buildZombie("normal"), mk = buildMonkey(0x8a5a2a);
    mk.g.position.set(0, 2.9, 0.1); mk.g.rotation.z = Math.PI / 2; mk.g.scale.setScalar(0.8); b.g.add(mk.g);
    b.g.position.set(0, 0, 26); scene.add(b.g);
    intro = { g: b.g, legL: b.legL, legR: b.legR, mk, z: 26, t: 0 };
    saveGame();
  }
  S.lastZone = zoneIdx(P.z);
  sfx("pick");
}

setSound(settings.sound);
applyQuality();
setOutfit(settings.outfit);
initNet();
showMenu();
requestAnimationFrame(frame);
